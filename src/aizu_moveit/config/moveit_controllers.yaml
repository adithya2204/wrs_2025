# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm1_manipulator_controller
    - arm2_manipulator_controller
    - arm1_fingers_controller
    - arm2_fingers_controller


  arm1_manipulator_controller:
    type: FollowJointTrajectory
    joints:
      - ARM1_SHOULDER
      - ARM1_ARM
      - ARM1_FOREARM
      - ARM1_WRIST1
      - ARM1_WRIST2
      - ARM1_HAND
    action_ns: follow_joint_trajectory
    default: true
  arm2_manipulator_controller:
    type: FollowJointTrajectory
    joints:
      - ARM2_SHOULDER
      - ARM2_ARM
      - ARM2_FOREARM
      - ARM2_WRIST1
      - ARM2_WRIST2
      - ARM2_HAND
    action_ns: follow_joint_trajectory
    default: true
  arm1_fingers_controller:
    type: FollowJointTrajectory
    joints:
      - ARM1_FINGER1
      - ARM1_FINGER2
      - ARM1_FINGER3
    command_joint: ARM1_FINGER1
    action_ns: follow_joint_trajectory
    default: true
  arm2_fingers_controller:
    type: FollowJointTrajectory
    joints:
      - ARM2_FINGER1
      - ARM2_FINGER2
      - ARM2_FINGER3
    command_joint: ARM2_FINGER1
    action_ns: follow_joint_trajectory
    default: true
