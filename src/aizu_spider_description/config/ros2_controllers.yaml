controller_manager:
  ros__parameters:
    update_rate: 1000  # Matches your AIST 1ms timestep

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm1_manipulator_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm2_manipulator_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm1_fingers_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm2_fingers_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm1_manipulator_controller:
  ros__parameters:
    joints:
      - ARM1_SHOULDER
      - ARM1_ARM
      - ARM1_FOREARM
      - ARM1_WRIST1
      - ARM1_WRIST2
      - ARM1_HAND
    command_interfaces:
      - position
    state_interfaces:
      - position

arm2_manipulator_controller:
  ros__parameters:
    joints:
      - ARM2_SHOULDER
      - ARM2_ARM
      - ARM2_FOREARM
      - ARM2_WRIST1
      - ARM2_WRIST2
      - ARM2_HAND
    command_interfaces:
      - position
    state_interfaces:
      - position

arm1_fingers_controller:
  ros__parameters:
    joints:
      - ARM1_FINGER1
      - ARM1_FINGER2
      - ARM1_FINGER3
    command_interfaces:
      - position
    state_interfaces:
      - position

arm2_fingers_controller:
  ros__parameters:
    joints:
      - ARM2_FINGER1
      - ARM2_FINGER2
      - ARM2_FINGER3
    command_interfaces:
      - position
    state_interfaces:
      - position
